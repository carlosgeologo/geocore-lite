<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jireth GeoCore Lite | Complejo Jireth C.A.</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 font-sans text-slate-900">

    <!-- PANTALLA LOGIN -->
    <div id="pantallaLogin" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
            <h2 class="text-2xl font-black text-center text-slate-900 uppercase">Jireth GeoCore Lite</h2>
            <p class="text-xs text-center font-bold text-slate-500">Complejo Jireth C.A.</p>
            
            <div class="space-y-3 pt-2">
                <label class="block text-xs font-black uppercase text-slate-700">Contraseña de Geólogos</label>
                <input type="password" id="inputClaveGeo" value="Mina2628" class="w-full p-3 border rounded-xl font-bold text-sm bg-slate-50">
                <button type="button" onclick="ingresarSistemaDirecto()" class="w-full bg-slate-900 text-white p-3.5 rounded-xl font-black text-sm hover:bg-slate-800 transition">
                    🔐 Ingresar al Sistema
                </button>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appPrincipal" class="hidden max-w-5xl mx-auto space-y-4">
        <header class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-lg font-black text-slate-900">Jireth GeoCore Lite</h1>
                <p class="text-xs font-bold text-emerald-600">🟢 Sistema Operativo Activo - Complejo Jireth C.A.</p>
            </div>
            <button type="button" onclick="location.reload()" class="bg-rose-50 text-rose-800 px-3 py-2 rounded-xl font-bold text-xs">Cerrar Sesión</button>
        </header>

        <section class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
            <h2 class="text-base font-black uppercase text-slate-800">🛠️ Panel de Control y Pozos</h2>
            <div class="flex gap-2">
                <input type="text" id="txtNuevoPozo" placeholder="Código del Pozo (Ej: S0001-ET)" class="flex-1 p-3 border rounded-xl font-bold text-sm uppercase">
                <button type="button" onclick="registrarPozoRapido()" class="bg-slate-900 text-white px-5 py-3 rounded-xl font-black text-xs">➕ Crear Pozo</button>
            </div>
            <div id="listaPozosUI" class="space-y-2 pt-2"></div>
        </section>
    </div>

    <script>
        let pozosData = JSON.parse(localStorage.getItem('jireth_pozos') || '{}');

        function ingresarSistemaDirecto() {
            const clave = document.getElementById('inputClaveGeo').value.trim();
            if (clave === "Mina2628" || clave.length > 2) {
                document.getElementById('pantallaLogin').classList.add('hidden');
                document.getElementById('appPrincipal').classList.remove('hidden');
                actualizarListaPozosUI();
            } else {
                alert("Contraseña incorrecta (Usa Mina2628)");
            }
        }

        function registrarPozoRapido() {
            const codigo = document.getElementById('txtNuevoPozo').value.trim().toUpperCase();
            if (!codigo) { alert("Ingrese un código de pozo válido."); return; }
            pozosData[codigo] = { codigo: codigo, fecha: new Date().toLocaleDateString(), estado: "ABIERTO", avances: [] };
            localStorage.setItem('jireth_pozos', JSON.stringify(pozosData));
            document.getElementById('txtNuevoPozo').value = '';
            actualizarListaPozosUI();
            alert("Pozo " + codigo + " creado con éxito.");
        }

        function actualizarListaPozosUI() {
            const contenedor = document.getElementById('listaPozosUI');
            if (!contenedor) return;
            contenedor.innerHTML = '';
            let keys = Object.keys(pozosData);
            if (keys.length === 0) {
                contenedor.innerHTML = '<p class="text-xs text-slate-500 font-bold">No hay pozos registrados todavía.</p>';
                return;
            }
            keys.forEach(k => {
                let p = pozosData[k];
                let div = document.createElement('div');
                div.className = "p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs font-bold";
                div.innerHTML = `<span>📍 Sondaje: ${p.codigo} (${p.estado})</span> <span class="text-emerald-700">Registrado</span>`;
                contenedor.appendChild(div);
            });
        }
    </script>
</body>
</html>
