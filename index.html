<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jireth GeoCore Lite | Control Operativo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-xl mx-auto space-y-6">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
            <h1 class="text-lg font-bold text-amber-400">Jireth GeoCore Lite</h1>
            <span id="contadorPozos" class="text-xs bg-emerald-900 text-emerald-300 px-3 py-1 rounded font-bold">Pozos: 0</span>
        </div>

        <!-- FORMULARIO DE APERTURA DIRECTA -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="text-xl font-black text-white">🛠️ Apertura de Sondaje</h2>
            
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-1">Código del Sondaje *</label>
                <input type="text" id="txtCodigo" placeholder="Ej. S0003ET" class="w-full p-3 bg-slate-900 text-white border border-slate-600 rounded-lg font-bold text-lg">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-1">Proyecto / Sector *</label>
                <input type="text" id="txtProyecto" placeholder="Ej. El Tronco" class="w-full p-3 bg-slate-900 text-white border border-slate-600 rounded-lg font-bold text-lg">
            </div>

            <button type="button" onclick="registrarPozo()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-4 rounded-xl text-lg shadow-lg active:scale-95 transition">
                💾 Registrar Sondaje Ahora
            </button>
        </div>

        <!-- LISTA DE POZOS REGISTRADOS -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-3">
            <h3 class="text-md font-bold text-sky-400">📋 Sondajes Registrados en este Dispositivo</h3>
            <div id="listaPozos" class="space-y-2">
                <p class="text-sm text-slate-400">No hay pozos creados todavía.</p>
            </div>
        </div>
    </div>

    <script>
        let baseDatos = { pozos: [] };

        function cargarDatos() {
            try {
                const guardado = localStorage.getItem('geo_db_v3');
                if (guardado) {
                    baseDatos = JSON.parse(guardado);
                }
            } catch(e) {
                baseDatos = { pozos: [] };
            }
            actualizarVista();
        }

        function registrarPozo() {
            const codigoInput = document.getElementById('txtCodigo');
            const proyectoInput = document.getElementById('txtProyecto');

            const codigo = codigoInput.value.trim().toUpperCase();
            const proyecto = proyectoInput.value.trim();

            if (!codigo || !proyecto) {
                alert("⚠️ Por favor ingrese el Código y el Proyecto.");
                return;
            }

            const nuevo = {
                id: Date.now(),
                codigo: codigo,
                proyecto: proyecto,
                fecha: new Date().toLocaleDateString()
            };

            baseDatos.pozos.push(nuevo);
            
            try {
                localStorage.setItem('geo_db_v3', JSON.stringify(baseDatos));
            } catch(e) {
                alert("Error al guardar en el teléfono");
                return;
            }

            // Limpiar campos
            codigoInput.value = '';
            proyectoInput.value = '';

            actualizarVista();
            alert("✅ ¡Sondaje " + codigo + " registrado con éxito!");
        }

        function actualizarVista() {
            const contenedor = document.getElementById('listaPozos');
            const contador = document.getElementById('contadorPozos');
            
            contador.textContent = "Pozos: " + baseDatos.pozos.length;

            if (baseDatos.pozos.length === 0) {
                contenedor.innerHTML = '<p class="text-sm text-slate-400">No hay pozos creados todavía.</p>';
                return;
            }

            contenedor.innerHTML = '';
            baseDatos.pozos.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = "p-3 bg-slate-900 rounded-lg border border-slate-700 flex justify-between items-center";
                item.innerHTML = `
                    <div>
                        <p class="font-black text-amber-400">${p.codigo}</p>
                        <p class="text-xs text-slate-400">Proyecto: ${p.proyecto} | Fecha: ${p.fecha}</p>
                    </div>
                    <span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded font-bold">Activo</span>
                `;
                contenedor.appendChild(item);
            });
        }

        // Ejecutar al iniciar
        cargarDatos();
    </script>
</body>
</html>
