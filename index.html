<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jireth GeoCore Lite | Complejo Jireth C.A.</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .btn-field { min-height: 48px; font-weight: 800; border-radius: 0.75rem; transition: all 0.15s ease-in-out; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .btn-field:active { transform: scale(0.98); }
        .input-field { min-height: 46px; border: 1.5px solid #cbd5e1; font-weight: 700; background-color: #ffffff; color: #0f172a; border-radius: 0.75rem; transition: border-color 0.2s; }
        .input-field:focus { border-color: #475569; outline: none; box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.12); }
        .bg-bienvenida-oficial { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .logo-jj-badge { width: 38px; height: 38px; border-radius: 0.75rem; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); border: 1px solid #3b82f6; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.15); overflow: hidden; flex-shrink: 0; }
        .logo-jj-badge::before { content: 'JJ'; font-size: 15px; font-weight: 900; background: linear-gradient(180deg, #fde047 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #sidebarMenu { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 0.75rem; font-weight: 700; color: #334155; cursor: pointer; width: 100%; text-align: left; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #0f172a; }
        .sidebar-item.active { background-color: #0f172a; color: #ffffff; }
        #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-card { background: #0f172a; color: #ffffff; border: 1.5px solid #10b981; padding: 12px 18px; border-radius: 1rem; font-size: 12px; font-weight: 800; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); opacity: 0; transform: translateY(20px); transition: all 0.3s; pointer-events: auto; }
        .toast-card.show { opacity: 1; transform: translateY(0); }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-2.5 sm:p-4 antialiased text-slate-800">

    <div id="toastContainer"></div>

    <!-- PANTALLA LOGIN CON EVENTOS CORREGIDOS -->
    <div id="pantallaLogin" class="fixed inset-0 bg-bienvenida-oficial z-50 flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto">
        <div class="bg-white p-5 sm:p-7 rounded-3xl border border-slate-200 w-full max-w-lg space-y-4 shadow-2xl relative text-slate-900">
            <div class="text-center pt-2 space-y-2">
                <div class="mx-auto flex items-center justify-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200 w-max">
                    <div class="logo-jj-badge" style="width: 48px; height: 48px;"></div>
                    <div class="text-left leading-tight">
                        <div class="text-base font-black tracking-wider text-slate-900">JIRETH <span class="text-slate-600 text-xs">GEOCORE LITE</span></div>
                        <div class="text-[10px] text-slate-600 font-extrabold uppercase">Complejo Jireth C.A.</div>
                    </div>
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-widest mt-2 uppercase">BIENVENIDOS</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-2.5 pt-1">
                <button type="button" id="tabPerfilGeo" class="py-3 px-2 rounded-2xl text-xs font-black border-2 border-slate-800 bg-slate-900 text-white">👷 GEÓLOGOS</button>
                <button type="button" id="tabPerfilGer" class="py-3 px-2 rounded-2xl text-xs font-black border-2 border-slate-200 bg-slate-100 text-slate-600">👔 GERENCIA</button>
            </div>

            <div id="boxLoginGeologos" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1.5 uppercase">Contraseña de Geólogos</label>
                    <input type="password" id="inputClaveGeo" placeholder="Mina2628..." class="input-field w-full px-3.5 text-sm font-bold">
                </div>
                <button type="button" id="btnLoginGeoSubmit" class="btn-field w-full bg-slate-900 text-white text-sm font-black">🔐 Ingresar como Geólogos</button>
            </div>

            <div id="boxLoginGerencia" class="hidden space-y-3.5">
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1.5 uppercase">Contraseña de Gerencia</label>
                    <input type="password" id="inputClaveGer" placeholder="JIRETH2026..." class="input-field w-full px-3.5 text-sm font-bold">
                </div>
                <button type="button" id="btnLoginGerSubmit" class="btn-field w-full bg-slate-700 text-white text-sm font-black">📊 Ingresar a Repositorio</button>
            </div>
        </div>
    </div>

    <!-- SIDEBAR MENU -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-950/50 z-50 hidden backdrop-blur-sm" onclick="toggleSidebar()"></div>
    <aside id="sidebarMenu" class="fixed top-0 left-0 bottom-0 w-80 bg-white z-50 shadow-2xl p-5 flex flex-col justify-between -translate-x-full border-r border-slate-200 overflow-y-auto">
        <div class="space-y-6">
            <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                <div class="flex items-center gap-3">
                    <div class="logo-jj-badge" style="width: 36px; height: 36px;"></div>
                    <div>
                        <h2 class="text-xs font-black uppercase text-slate-900">Jireth GeoCore</h2>
                        <p class="text-[10px] text-slate-500 font-bold">Menú Operativo</p>
                    </div>
                </div>
                <button type="button" onclick="toggleSidebar()" class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 font-black">✕</button>
            </div>
            <nav class="space-y-1.5 text-xs">
                <button type="button" onclick="switchTab('mod_sala'); toggleSidebar();" id="sidebar-mod_sala" class="sidebar-item active">🏠 Sala Situacional</button>
                <button type="button" onclick="switchTab('mod1'); toggleSidebar();" id="sidebar-mod1" class="sidebar-item">🛠️ Lista de Pozos / Registrar</button>
                <button type="button" onclick="switchTab('mod2'); toggleSidebar();" id="sidebar-mod2" class="sidebar-item">📍 Ficha Topográfica</button>
                <button type="button" onclick="switchTab('mod3_unificado'); toggleSidebar();" id="sidebar-mod3_unificado" class="sidebar-item">🪵 Turnos & Core Logging</button>
                <button type="button" onclick="switchTab('mod4'); toggleSidebar();" id="sidebar-mod4" class="sidebar-item">🏁 Cierre de Sondaje</button>
                <button type="button" onclick="switchTab('mod5'); toggleSidebar();" id="sidebar-mod5" class="sidebar-item">📑 Repositorio & DSR</button>
                <button type="button" onclick="switchTab('mod6'); toggleSidebar();" id="sidebar-mod6" class="sidebar-item">⚙️ Administración</button>
            </nav>
        </div>
        <button type="button" onclick="cerrarSesion()" class="w-full bg-slate-100 text-slate-800 py-2.5 rounded-xl font-bold text-xs">🚪 Cerrar Sesión</button>
    </aside>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appPrincipal" class="hidden space-y-3.5 max-w-7xl mx-auto pb-16">
        <header class="bg-white p-3.5 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <button type="button" onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-300 flex items-center justify-center font-black">☰</button>
                <div class="logo-jj-badge"></div>
                <div>
                    <h1 class="text-base font-black text-slate-900">Jireth GeoCore Lite <span class="text-xs text-slate-500 font-normal">Cloud Pro</span></h1>
                    <p class="text-[11px] text-slate-600">Complejo Jireth C.A. <span id="indicadorRed" class="text-emerald-700 font-bold">(🟢 Sincronizado)</span></p>
                </div>
            </div>
            <button type="button" onclick="cerrarSesion()" class="text-xs bg-rose-50 text-rose-800 px-3 py-2 rounded-xl font-extrabold border border-rose-300">🚪 Salir</button>
        </header>

        <!-- SECCIONES DE MÓDULOS (SALA, MOD1, MOD2, MOD3, MOD4, MOD5, MOD6) -->
        <section id="mod_sala" class="space-y-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
            <h2 class="text-xl font-black">🏠 Sala Situacional (Frentes Activos)</h2>
            <div id="gridSalaSituacional" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>

        <!-- [Espacio reservado para los demás módulos lógicos de tu aplicación] -->
    </div>

    <script>
        // --- INICIALIZACIÓN Y Vínculos robustos asegurados ---
        let perfilActual = 'GEOLOGOS';
        let pozosData = JSON.parse(localStorage.getItem('jireth_pozos') || '{}');
        let pozoActivoId = localStorage.getItem('jireth_pozo_activo') || '';
        let turnosData = JSON.parse(localStorage.getItem('jireth_turnos') || '{}');
        let turnoActivoObj = JSON.parse(localStorage.getItem('jireth_turno_activo') || 'null');

        document.addEventListener('DOMContentLoaded', () => {
            // Vínculos explícitos para evitar fallos de ejecución en botones de login
            document.getElementById('tabPerfilGeo').addEventListener('click', () => seleccionarPerfil('GEOLOGOS'));
            document.getElementById('tabPerfilGer').addEventListener('click', () => seleccionarPerfil('GERENCIA'));
            document.getElementById('btnLoginGeoSubmit').addEventListener('click', intentarLoginGeo);
            document.getElementById('btnLoginGerSubmit').addEventListener('click', intentarLoginGer);

            renderizarSalaSituacional();
        });

        function seleccionarPerfil(perfil) {
            perfilActual = perfil;
            if (perfil === 'GEOLOGOS') {
                document.getElementById('tabPerfilGeo').className = "py-3 px-2 rounded-2xl text-xs font-black border-2 border-slate-800 bg-slate-900 text-white";
                document.getElementById('tabPerfilGer').className = "py-3 px-2 rounded-2xl text-xs font-black border-2 border-slate-200 bg-slate-100 text-slate-600";
                document.getElementById('boxLoginGeologos').classList.remove('hidden');
                document.getElementById('boxLoginGerencia').classList.add('hidden');
            } else {
                document.getElementById('tabPerfilGer').className = "py-3 px-2 rounded-2xl text-xs font-black border-2 border-slate-700 bg-slate-800 text-white";
                document.getElementById('tabPerfilGeo').className = "py-3 px-2 rounded-2xl text-xs font-black border-2 border-slate-200 bg-slate-100 text-slate-600";
                document.getElementById('boxLoginGerencia').classList.remove('hidden');
                document.getElementById('boxLoginGeologos').classList.add('hidden');
            }
        }

        function intentarLoginGeo() {
            const val = document.getElementById('inputClaveGeo').value.trim();
            const claveGeo = localStorage.getItem('jireth_clave_geo') || 'Mina2628';
            if (val === claveGeo) {
                entrarAlSistema();
            } else {
                alert("❌ Contraseña incorrecta. (Por defecto: Mina2628)");
            }
        }

        function intentarLoginGer() {
            const val = document.getElementById('inputClaveGer').value.trim();
            if (val === 'JIRETH2026') {
                entrarAlSistema();
            } else {
                alert("❌ Contraseña de gerencia incorrecta. (Por defecto: JIRETH2026)");
            }
        }

        function entrarAlSistema() {
            document.getElementById('pantallaLogin').classList.add('hidden');
            document.getElementById('appPrincipal').classList.remove('hidden');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function switchTab(tabId) {
            ['mod_sala', 'mod1', 'mod2', 'mod3_unificado', 'mod4', 'mod5', 'mod6'].forEach(t => {
                const sec = document.getElementById(t);
                if (sec) sec.classList.add('hidden');
            });
            const sel = document.getElementById(tabId);
            if (sel) sel.classList.remove('hidden');
        }

        function renderizarSalaSituacional() {
            const grid = document.getElementById('gridSalaSituacional');
            if (!grid) return;
            grid.innerHTML = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 col-span-full text-center text-xs font-bold text-slate-600">Sistema GeoCore Lite Operativo en Complejo Jireth C.A.</div>`;
        }

        function cerrarSesion() { location.reload(); }
    </script>
</body>
</html>
